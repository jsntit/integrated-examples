name: Build Caddy By AI

on:
  workflow_dispatch:

  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: windows-386
            GOOS: windows
            GOARCH: 386

          - name: windows-amd64
            GOOS: windows
            GOARCH: amd64

          - name: linux-amd64
            GOOS: linux
            GOARCH: amd64

          - name: linux-arm64
            GOOS: linux
            GOARCH: arm64

          - name: linux-armv5
            GOOS: linux
            GOARCH: arm
            GOARM: 5

          - name: linux-s390x
            GOOS: linux
            GOARCH: s390x

          - name: freebsd-amd64
            GOOS: freebsd
            GOARCH: amd64

          - name: freebsd-arm64
            GOOS: freebsd
            GOARCH: arm64

          - name: darwin-amd64
            GOOS: darwin
            GOARCH: amd64

          - name: darwin-arm64
            GOOS: darwin
            GOARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Show Go Environment
        run: |
          go version
          go env

      - name: Show GitHub Context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: ${{ matrix.GOARM }}
        run: |
          mkdir -p release-tmp

          ~/go/bin/xcaddy build \
            --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive \
            --with github.com/imgk/caddy-trojan \
            --with github.com/mholt/caddy-webdav \
            --with github.com/WeidiDeng/caddy-cloudflare-ip \
            --with github.com/xcaddyplugins/caddy-trusted-cloudfront \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/caddy-dns/duckdns \
            --with github.com/caddy-dns/tencentcloud \
            --with github.com/mholt/caddy-events-exec \
            --with github.com/mholt/caddy-l4 \
            --with github.com/caddyserver/jsonc-adapter \
            --with github.com/tailscale/caddy-tailscale \
            --with github.com/porech/caddy-maxmind-geolocation \
            --output ./release-tmp/caddy

      - name: Rename Windows Binary
        if: matrix.GOOS == 'windows'
        run: |
          mv ./release-tmp/caddy ./release-tmp/caddy.exe

      - name: Generate SHA256
        run: |
          cd release-tmp
          sha256sum * > sha256.txt

      - name: Package Release
        run: |
          mkdir -p release-ready

          if [ "${{ matrix.GOOS }}" = "windows" ]; then
            cd release-tmp
            zip -r ../release-ready/caddy-${{ matrix.name }}.zip *
          else
            cd release-tmp
            tar -zcvf ../release-ready/caddy-${{ matrix.name }}.tar.gz *
          fi

      - name: Show Release Files
        run: |
          ls -lh release-ready

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.name }}
          path: release-ready/*
          retention-days: 7

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-ready/*
          generate_release_notes: true
          fail_on_unmatched_files: true
